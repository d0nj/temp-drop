[package]
name = "tempdrop"
version = "0.1.2"
edition = "2021"
description = "Single-binary temporary file hosting"

[lib]
name = "tempdrop"
path = "src/lib.rs"

[[bin]]
name = "tempdrop"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rust-embed = "8"
aws-sdk-s3 = "1"
aws-config = "1"
rand = "0.9"
fs2 = "0.4"
bytes = "1"
http = "1"
tokio-util = { version = "0.7", features = ["io"] }
mime_guess = "2"
chrono = "0.4"
futures-util = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
