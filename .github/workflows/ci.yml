name: ci

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'ui/**'
      - 'Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'ui/**'
      - 'Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target

      - name: Build Svelte UI Bundle
        working-directory: ui
        run: npm ci && npm run build

      - name: Format check
        if: matrix.os == 'ubuntu-24.04'
        working-directory: server
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.os == 'ubuntu-24.04'
        working-directory: server
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test
        working-directory: server
        run: cargo test --locked --all-targets

  # Warms the release cache on main pushes. Tag runs can only restore caches
  # from the default branch, so without this every tag rebuilds all deps.
  # Job name must match release.yml's build job for the cache keys to align.
  build:
    name: Warm Release Cache (${{ matrix.target }})
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target

      - name: Build Svelte UI Bundle
        working-directory: ui
        run: npm ci && npm run build

      - name: Build Release Binary
        working-directory: server
        run: cargo build --release --locked --target ${{ matrix.target }}
