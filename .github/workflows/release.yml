name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  ui:
    name: Build UI Bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build Svelte UI Bundle
        working-directory: ui
        run: npm ci && npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 1

  build:
    name: Build (${{ matrix.target }})
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: tempdrop-linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: tempdrop-linux-arm64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            asset: tempdrop-windows-amd64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: tempdrop-windows-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: tempdrop-darwin-amd64
          - os: macos-15
            target: aarch64-apple-darwin
            asset: tempdrop-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0
        env:
          SCCACHE_GHA_ENABLED: 'true'

      - uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui/dist

      - name: Build Release Binary
        working-directory: server
        env:
          RUSTC_WRAPPER: sccache
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Release Assets
        shell: bash
        run: |
          set -euo pipefail
          BIN_NAME="tempdrop"
          if [[ "${{ matrix.os }}" == windows-* ]]; then BIN_NAME="tempdrop.exe"; fi
          BIN_PATH="server/target/${{ matrix.target }}/release/${BIN_NAME}"
          mkdir -p dist
          cp "${BIN_PATH}" "dist/${{ matrix.asset }}"
          cd dist
          (sha256sum "${{ matrix.asset }}" || shasum -a 256 "${{ matrix.asset }}") > "${{ matrix.asset }}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          pattern: tempdrop-*
          merge-multiple: true

      - name: Attest Release Binaries
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release/*

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes
