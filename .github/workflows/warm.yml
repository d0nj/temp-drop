name: warm

# Warms the release cache in the default branch's scope so tag builds can
# restore compiled release deps instead of rebuilding. Only runs when the
# dependency graph changes (Cargo.toml/Cargo.lock) — the only time a tag
# build would be cold anyway. Job name must match release.yml's build job
# for the cache keys to align.
on:
  push:
    branches: [main]
    paths:
      - 'server/Cargo.toml'
      - 'server/Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Warm Release Cache (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target

      - name: Build Svelte UI Bundle
        working-directory: ui
        run: npm ci && npm run build

      - name: Build Release Binary
        working-directory: server
        run: cargo build --release --locked --target ${{ matrix.target }}